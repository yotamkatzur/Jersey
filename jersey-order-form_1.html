<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0a23;
  --bg-mid: #0f1b3d;
  --bg-card: #16213e;
  --border: #2a2a5a;
  --accent: #e94560;
  --accent-light: #ff6b6b;
  --green: #2ecc71;
  --green-dark: #1a7a3a;
  --text: #eee;
  --text-dim: #8899aa;
  --text-dimmer: #556;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 40%, #0a1628 100%);
  font-family: 'Heebo', 'Segoe UI', Tahoma, sans-serif;
  color: var(--text);
  direction: rtl;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg-deep); }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }

.header {
  background: linear-gradient(135deg, #0f3460, #16213e 50%, #1a1a3e);
  padding: 30px 20px 24px;
  text-align: center;
  border-bottom: 2px solid var(--accent);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 120%, rgba(233,69,96,0.15), transparent 60%);
}
.header-content { position: relative; z-index: 1; }
.header h1 {
  font-size: 28px;
  font-weight: 900;
  margin: 0 0 6px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header p { font-size: 13px; color: #8899bb; }

.container { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }

.stats-bar { display:flex; justify-content:center; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
.stat-box {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 10px 18px;
  border: 1px solid var(--border);
  text-align: center;
  min-width: 70px;
}
.stat-icon { font-size: 20px; }
.stat-value { font-size: 22px; font-weight: 900; color: var(--accent); }
.stat-label { font-size: 10px; color: var(--text-dim); }

.order-card {
  background: linear-gradient(135deg, var(--bg-card), #1a1a3e);
  border-radius: 14px;
  padding: 18px 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  animation: fadeIn 0.3s ease-out;
}
.order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.order-num { font-size:14px; font-weight:700; color:var(--accent); }
.btn-remove {
  background: rgba(233,69,96,0.15);
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 6px;
  color: var(--accent);
  cursor: pointer;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Heebo', sans-serif;
}
.fields-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
.field-label { font-size:11px; color:var(--text-dim); margin-bottom:4px; display:block; font-weight:600; }
.field-input {
  width: 100%;
  background: var(--bg-mid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Heebo', sans-serif;
  transition: border-color 0.2s;
  direction: rtl;
}
.field-input:focus { outline:none; border-color:var(--accent); }
.field-input::placeholder { color: #556; }

/* Dropdown */
.dropdown { position:relative; }
.dropdown-trigger {
  width:100%;
  background: var(--bg-mid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Heebo', sans-serif;
  cursor: pointer;
  text-align: right;
  min-height: 38px;
  transition: border-color 0.2s;
}
.dropdown-trigger.placeholder { color: #556; }
.dropdown-trigger.disabled { background:#0d1a30; cursor:not-allowed; }
.dropdown-trigger.open { border-color: var(--accent); }
.dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: var(--bg-card);
  border: 1px solid var(--accent);
  border-radius: 0 0 8px 8px;
  z-index: 999;
  max-height: 200px;
  overflow: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  display: none;
}
.dropdown-menu.visible { display:block; }
.dropdown-search {
  width:100%;
  background: var(--bg-mid);
  border:none;
  border-bottom:1px solid var(--border);
  padding:8px 12px;
  color:var(--text);
  font-size:13px;
  direction:rtl;
  font-family:'Heebo',sans-serif;
}
.dropdown-search:focus { outline:none; }
.dropdown-item {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  color: #ccc;
  transition: background 0.15s;
}
.dropdown-item:hover { background: #1a2a5a; }
.dropdown-item.selected { background: var(--accent); color: #fff; }

/* Buttons */
.btn-row { display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
.btn {
  border:none; border-radius:10px; padding:12px 28px;
  font-size:15px; font-weight:700; cursor:pointer;
  font-family:'Heebo',sans-serif;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn:hover { transform:translateY(-2px); }
.btn-add {
  background: linear-gradient(135deg, var(--accent), #c0392b);
  color:#fff;
  box-shadow: 0 4px 20px rgba(233,69,96,0.3);
}
.btn-send {
  background: linear-gradient(135deg, var(--green-dark), var(--green));
  color:#fff;
  font-size:16px; font-weight:900; padding:12px 32px;
  box-shadow: 0 4px 24px rgba(46,204,113,0.35);
  letter-spacing:1px;
}
.btn-send:disabled { background:linear-gradient(135deg,#555,#444); cursor:wait; }
.btn-summary {
  background: linear-gradient(135deg, #0f3460, #16213e);
  color:#eee; border:1px solid var(--border);
}
.btn-copy {
  background: linear-gradient(135deg, #2c3e50, #34495e);
  color:#eee;
}

/* Status banner */
.status-banner {
  margin:16px 0; padding:14px 20px; border-radius:12px;
  text-align:center; font-weight:600; font-size:14px;
  animation: fadeIn 0.3s ease-out;
}
.status-sending {
  background: linear-gradient(90deg,#1a3a6a,#0f3460,#1a3a6a);
  background-size:200% 100%;
  animation: shimmer 1.5s infinite;
  border:1px solid #3a6a9a; color:#fff;
}
.status-success { background:linear-gradient(135deg,#0d4a2a,#1a7a3a); border:1px solid var(--green); color:#fff; }
.status-error { background:linear-gradient(135deg,#4a0d0d,#7a1a1a); border:1px solid var(--accent); color:#fff; }
.spinner {
  display:inline-block; width:16px; height:16px;
  border:2px solid #fff; border-top-color:transparent;
  border-radius:50%; animation:spin 0.8s linear infinite;
  margin-left:8px; vertical-align:middle;
}

.sheet-link { text-align:center; margin-top:14px; }
.sheet-link a { color:#4a9eff; font-size:12px; text-decoration:none; opacity:0.8; }
.sheet-link a:hover { opacity:1; }

/* Summary table */
.summary-box {
  margin-top:24px; background:var(--bg-card); border-radius:14px;
  border:1px solid var(--border); overflow:auto; animation:fadeIn 0.3s ease-out;
}
.summary-title {
  padding:14px 18px; border-bottom:1px solid var(--border);
  font-size:16px; font-weight:700; color:var(--accent);
}
.summary-table { width:100%; border-collapse:collapse; font-size:12px; }
.summary-table th {
  padding:10px 8px; background:#0f3460; color:#8899bb;
  font-weight:600; border-bottom:1px solid var(--border);
  white-space:nowrap; text-align:right;
}
.summary-table td { padding:8px; border-bottom:1px solid #1a1a3e; }

.footer-note {
  text-align:center; margin-top:28px; color:var(--text-dimmer);
  font-size:11px; line-height:1.7;
}
</style>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycQo0PRsd7FBF7a1MQeGE7n9Sfg48nygGW9o2Bz53yeDE6QpdVoKUBagNx-Sb6sZ0/exec";
const SIZES = ["XS","S","M","L","XL","XXL","3XL","4XL"];
const KIT_TYPES = ["בית (Home)","חוץ (Away)","שלישית (Third)"];
const SHIRT_TYPES = ["חולצת אוהד (Fan/Replica)","חולצת שחקן (Player/Authentic)"];
const SHEET_HEADERS = ["תאריך","שם המזמין","נבחרת","בית / חוץ","מידה","סוג חולצה","שחקן","מספר","שם על הגב"];

const teamNames = Object.keys(TEAMS_DATA).sort((a,b) => {
  const na = a.replace(/^[^\s]+\s/,"");
  const nb = b.replace(/^[^\s]+\s/,"");
  return na.localeCompare(nb);
});

// State
let orders = [{ id:1, name:"", team:"", kitType:"", size:"", shirtType:"", playerName:"", playerNumber:"", customBack:"" }];
let nextId = 2;
let showSummary = false;
let sentCount = 0;
let sendStatus = null;
let openDropdown = null;

// Close dropdowns on outside click
document.addEventListener("click", (e) => {
  if (openDropdown && !e.target.closest(".dropdown")) {
    openDropdown.querySelector(".dropdown-menu").classList.remove("visible");
    openDropdown.querySelector(".dropdown-trigger").classList.remove("open");
    openDropdown = null;
  }
});

function render() {
  const filledOrders = orders.filter(o => o.name && o.team);
  const uniqueTeams = [...new Set(orders.filter(o=>o.team).map(o=>o.team))].length;

  // Stats
  document.getElementById("statsBar").innerHTML = [
    { label:"הזמנות", value:orders.length, icon:"📋" },
    { label:"נבחרות", value:uniqueTeams, icon:"🏳️" },
    { label:"הושלמו", value:filledOrders.length, icon:"✅" },
    { label:"נשלחו", value:sentCount, icon:"📤" }
  ].map(s => `
    <div class="stat-box">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join("");

  // Orders
  document.getElementById("ordersContainer").innerHTML = orders.map((o, i) => `
    <div class="order-card" data-id="${o.id}">
      <div class="order-header">
        <span class="order-num">הזמנה #${i+1}</span>
        <button class="btn-remove" onclick="removeOrder(${o.id})">✕ הסר</button>
      </div>
      <div class="fields-grid">
        <div>
          <label class="field-label">שם המזמין</label>
          <input class="field-input" value="${esc(o.name)}" placeholder="שם מלא" oninput="updateField(${o.id},'name',this.value)">
        </div>
        <div>
          <label class="field-label">נבחרת</label>
          ${makeDropdown(o.id, 'team', o.team, teamNames, 'בחר נבחרת...', false)}
        </div>
        <div>
          <label class="field-label">בית / חוץ</label>
          ${makeDropdown(o.id, 'kitType', o.kitType, KIT_TYPES, 'בחר...', false)}
        </div>
        <div>
          <label class="field-label">מידה</label>
          ${makeDropdown(o.id, 'size', o.size, SIZES, 'בחר מידה...', false)}
        </div>
        <div>
          <label class="field-label">סוג חולצה</label>
          ${makeDropdown(o.id, 'shirtType', o.shirtType, SHIRT_TYPES, 'אוהד / שחקן...', false)}
        </div>
        <div>
          <label class="field-label">שחקן מהרשימה</label>
          ${makeDropdown(o.id, 'player', o.playerName ? o.playerName+' (#'+o.playerNumber+')' : '',
            o.team && TEAMS_DATA[o.team] ? TEAMS_DATA[o.team].players.map(p=>p.name+' (#'+p.no+')') : [],
            o.team ? 'בחר שחקן...' : 'בחר נבחרת קודם', !o.team)}
        </div>
        <div>
          <label class="field-label">מספר</label>
          <input class="field-input" type="number" value="${esc(o.playerNumber)}" placeholder="#"
            style="direction:ltr;text-align:center" min="1" max="99"
            oninput="updateField(${o.id},'playerNumber',this.value)">
        </div>
        <div>
          <label class="field-label">שם על הגב (חופשי)</label>
          <input class="field-input" value="${esc(o.customBack)}" placeholder="${esc(o.playerName||'כל שם / שפה')}"
            style="direction:auto" oninput="updateField(${o.id},'customBack',this.value)">
        </div>
      </div>
    </div>
  `).join("");

  // Buttons
  document.getElementById("btnRow").innerHTML = `
    <button class="btn btn-add" onclick="addOrder()">➕ הוסף הזמנה</button>
    <button class="btn btn-send" ${sendStatus==='sending'?'disabled':''} onclick="handleSend()">
      ${sendStatus==='sending' ? '⏳ שולח...' : '📤 שלח לטבלה'}
    </button>
    ${filledOrders.length > 0 ? `
      <button class="btn btn-summary" onclick="toggleSummary()">${showSummary?'🔼 הסתר סיכום':'📊 הצג סיכום'}</button>
      <button class="btn btn-copy" onclick="exportText()">📋 העתק הזמנות</button>
    ` : ''}
  `;

  // Summary
  if (showSummary && filledOrders.length > 0) {
    document.getElementById("summaryBox").innerHTML = `
      <div class="summary-box">
        <div class="summary-title">📊 סיכום הזמנות (${filledOrders.length})</div>
        <table class="summary-table">
          <thead><tr>${["#","שם","נבחרת","בית/חוץ","מידה","סוג","שחקן","מס׳","שם על הגב"].map(h=>'<th>'+h+'</th>').join("")}</tr></thead>
          <tbody>${filledOrders.map((o,i) => `<tr>
            <td style="color:var(--accent);font-weight:700">${i+1}</td>
            <td>${esc(o.name)}</td><td>${esc(o.team)}</td><td>${esc(o.kitType)||'—'}</td>
            <td>${esc(o.size)||'—'}</td><td style="font-size:11px">${esc(o.shirtType)||'—'}</td>
            <td>${esc(o.playerName)||'—'}</td><td style="text-align:center">${o.playerNumber||'—'}</td>
            <td style="direction:ltr">${esc(o.customBack||o.playerName)||'—'}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    `;
  } else {
    document.getElementById("summaryBox").innerHTML = "";
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function makeDropdown(orderId, field, value, options, placeholder, disabled) {
  const hasValue = value && value.length > 0;
  const showSearch = options.length > 6;
  const uid = `dd_${orderId}_${field}`;
  return `
    <div class="dropdown" id="${uid}">
      <div class="dropdown-trigger ${hasValue?'':'placeholder'} ${disabled?'disabled':''}"
           onclick="${disabled?'':(`toggleDropdown('${uid}')`)}">
        ${hasValue ? esc(value) : placeholder}
      </div>
      <div class="dropdown-menu">
        ${showSearch ? `<input class="dropdown-search" placeholder="🔍 חפש..." oninput="filterDropdown('${uid}',this.value)">` : ''}
        <div class="dropdown-options">
          ${options.map(o => `<div class="dropdown-item ${o===value?'selected':''}"
            onclick="selectDropdown(${orderId},'${field}',this.textContent,'${uid}')">${esc(o)}</div>`).join("")}
        </div>
      </div>
    </div>
  `;
}

function toggleDropdown(uid) {
  const el = document.getElementById(uid);
  const menu = el.querySelector(".dropdown-menu");
  const trigger = el.querySelector(".dropdown-trigger");
  const isOpen = menu.classList.contains("visible");

  // Close any other open dropdown
  if (openDropdown && openDropdown !== el) {
    openDropdown.querySelector(".dropdown-menu").classList.remove("visible");
    openDropdown.querySelector(".dropdown-trigger").classList.remove("open");
  }

  if (isOpen) {
    menu.classList.remove("visible");
    trigger.classList.remove("open");
    openDropdown = null;
  } else {
    menu.classList.add("visible");
    trigger.classList.add("open");
    openDropdown = el;
    const searchInput = menu.querySelector(".dropdown-search");
    if (searchInput) { searchInput.value = ""; filterDropdown(uid,""); setTimeout(()=>searchInput.focus(),50); }
  }
}

function filterDropdown(uid, query) {
  const el = document.getElementById(uid);
  const items = el.querySelectorAll(".dropdown-item");
  const q = query.toLowerCase();
  items.forEach(item => {
    item.style.display = item.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

function selectDropdown(orderId, field, value, uid) {
  if (field === 'player') {
    const match = value.match(/^(.+)\s\(#(\d+)\)$/);
    if (match) {
      updateField(orderId, 'playerName', match[1]);
      updateField(orderId, 'playerNumber', match[2]);
    }
  } else if (field === 'team') {
    updateField(orderId, field, value);
    updateField(orderId, 'playerName', '');
    updateField(orderId, 'playerNumber', '');
  } else {
    updateField(orderId, field, value);
  }
  const el = document.getElementById(uid);
  if (el) {
    el.querySelector(".dropdown-menu").classList.remove("visible");
    el.querySelector(".dropdown-trigger").classList.remove("open");
  }
  openDropdown = null;
  render();
}

function updateField(orderId, field, value) {
  const o = orders.find(o => o.id === orderId);
  if (o) o[field] = value;
}

function addOrder() {
  orders.push({ id:nextId++, name:"", team:"", kitType:"", size:"", shirtType:"", playerName:"", playerNumber:"", customBack:"" });
  render();
}

function removeOrder(id) {
  if (orders.length === 1) return;
  orders = orders.filter(o => o.id !== id);
  render();
}

function toggleSummary() {
  showSummary = !showSummary;
  render();
}

async function handleSend() {
  const filled = orders.filter(o => o.name && o.team);
  if (filled.length === 0) {
    showStatus("error", "אין הזמנות מלאות לשליחה. מלא לפחות שם ונבחרת.");
    return;
  }

  showStatus("sending", "שולח נתונים לטבלה...");

  const now = new Date();
  const dateStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

  const rows = filled.map(o => [
    dateStr, o.name, o.team, o.kitType||"", o.size||"",
    o.shirtType||"", o.playerName||"",
    o.playerNumber ? String(o.playerNumber) : "",
    o.customBack || o.playerName || ""
  ]);

  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ orders: rows })
    });
    const result = await resp.json();
    if (result.success) {
      sentCount += filled.length;
      showStatus("success", `✅ ${filled.length} הזמנות נשלחו בהצלחה לטבלה!`);
    } else {
      showStatus("error", `❌ שגיאה: ${result.error || "לא ידוע"}`);
    }
  } catch(err) {
    showStatus("error", `❌ שגיאה: ${err.message}`);
  }
}

function showStatus(status, msg) {
  sendStatus = status;
  const banner = document.getElementById("statusBanner");
  banner.className = "status-banner status-" + status;
  banner.innerHTML = (status==="sending" ? '<span class="spinner"></span>' : '') + msg;
  banner.style.display = "block";
  render();
  if (status !== "sending") {
    setTimeout(() => { banner.style.display="none"; sendStatus=null; render(); }, status==="success"?4000:5000);
  }
}

function exportText() {
  const filled = orders.filter(o => o.name && o.team);
  let text = "🏆 הזמנת חולצות מונדיאל 2026\n" + "═".repeat(36) + "\n\n";
  filled.forEach((o, i) => {
    text += `הזמנה #${i+1}\nשם: ${o.name}\nנבחרת: ${o.team}\nסוג: ${o.kitType||"—"}\nמידה: ${o.size||"—"}\nחולצה: ${o.shirtType||"—"}\nשחקן: ${o.playerName||"—"} #${o.playerNumber||"—"}\nשם על הגב: ${o.customBack||o.playerName||"—"}\n${"─".repeat(30)}\n\n`;
  });
  text += `סה"כ: ${filled.length} חולצות\n`;
  navigator.clipboard.writeText(text).then(() => alert("הטקסט הועתק ללוח!"));
}

// Initial render
document.getElementById("statusBanner").style.display = "none";
render();
</script>
</body>
</html>
